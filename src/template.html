<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dynamic Time Board</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;color:#343c49;background:#fafaf9}*{box-sizing:border-box}body{margin:0;padding:20px}header{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;column-gap:18px;row-gap:12px;margin-bottom:14px}h1{margin:0 0 5px;font-size:21px;font-weight:700}header .secondary{max-width:600px}.muted{color:#7c8592;font-size:12px}.actions{display:flex!important;gap:8px;flex-flow:row nowrap!important;align-items:center;justify-content:flex-end;white-space:nowrap;min-width:0}button,select{font:inherit;background:#fff;border:1px solid #dde2e6;border-radius:9px;color:#3a4555;padding:8px 12px;cursor:pointer}select{max-width:190px}.actions #language{width:115px;flex:0 0 115px}.actions #project{width:175px;flex:0 0 175px}.actions #reload{flex:0 0 auto}button:hover{background:#f4f6f7}button:disabled{opacity:.5;cursor:wait}.actions button{white-space:nowrap}.board{display:grid;grid-template-columns:repeat(4,minmax(155px,1fr));gap:12px;align-items:stretch;min-height:55vh}.lane{min-width:0;border-radius:14px;border:1px solid var(--border);background:var(--bg);padding:14px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--ink,#4d5965);font-size:15px;font-weight:700}.count{display:inline-flex;align-items:center;justify-content:center;border-radius:99px;min-width:24px;height:24px;padding:0 7px;background:#ffffffc9;font-weight:650;font-size:12px;flex-shrink:0}.help-detail{display:none}.show-help .help-detail{display:block}.actions #toggleHelp{flex:0 0 auto;white-space:nowrap}.hint{color:#8a919b;font-size:11px;margin:5px 0 13px;line-height:1.5}.task{border-radius:10px;background:#fff;border:1px solid #e7e9eb;padding:10px 11px;margin:8px 0;overflow-wrap:anywhere;box-shadow:0 1px 2px #00000006}.task-title{font-size:13px;line-height:1.5;font-weight:600}.task-meta{margin-top:5px;color:#7d8896;font-size:11px;line-height:1.45}.task-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:9px;min-width:0}
.task-heading .task-title{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.project-tag{display:inline-block;flex:0 1 auto;max-width:45%;min-width:0;align-self:flex-start;padding:2px 7px;border-radius:6px;background:#f3f5f7;color:#788391;border:1px solid #e8edf1;font-size:10px;line-height:1.45;font-weight:500;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.task-meta{display:flex;flex-direction:column;align-items:flex-start;gap:3px;margin-top:7px;line-height:1.4}
.meta-row{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:6px;row-gap:2px;min-width:0;max-width:100%}
.meta-label{color:#9099a5;white-space:nowrap;flex-shrink:0}
.meta-day,.meta-time{white-space:nowrap;font-variant-numeric:tabular-nums;overflow-wrap:normal;word-break:normal}
.meta-separator{white-space:nowrap;color:#a5aeb8}
.meta-legacy{color:#8a919b}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.pill{font-size:10px;font-weight:600;border-radius:6px;padding:3px 6px;line-height:1.4}.pill.neutral{color:#4d6475;background:#e9f1f7}.pill.caution{color:#ad6326;background:#fff1df}.pill.attention{color:#866c21;background:#fff2d1}.pill.danger{color:#ae433c;background:#fae8e5}.empty{text-align:center;color:#a3a9b2;font-size:12px;padding:30px 6px}.foot{margin:12px 0 0;color:#818996;font-size:11px}.notice{margin:0 0 12px;background:#fff5e1;color:#75592a;border:1px solid #f0dfb9;padding:10px 12px;border-radius:10px;font-size:12px}.error{background:#ffeded;border-color:#f1c8c8;color:#a83b3b}.bottom{margin-top:14px;background:#eff1f3;padding:13px;border-radius:12px}.bottom.unknown{background:#fff5e7}.unscheduled-head,.alert-title{display:flex;align-items:center;justify-content:space-between;gap:10px}.unscheduled-head .section-title,.alert-title .section-title{justify-content:flex-start;gap:12px}.small-btn{font-size:12px;padding:6px 10px;flex-shrink:0}.bottom-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px;max-height:440px;overflow-y:auto;align-content:start;padding-right:3px}.bottom-items .task{margin:0}.hidden{display:none!important}.alerts{margin-top:14px;background:#fff9ee;border:1px solid #f2e8ce;border-radius:12px;padding:13px}.risk-window-control{display:inline-flex;align-items:center;gap:6px;margin-left:auto;color:#6b7280;font-size:12px;white-space:nowrap}.risk-window-control select{font-size:12px;padding:5px 24px 5px 8px;max-width:none;min-width:78px}.risk-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}@media(max-width:600px){.risk-window-control{margin-left:0}.risk-controls{justify-content:flex-end}}.risk-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:9px;max-height:440px;overflow-y:auto;align-content:start;padding-right:3px}.risk-items .task{margin:0}.legend{font-size:11px;color:#89919d;margin-top:8px}button:focus-visible,select:focus-visible{outline:2px solid #628ed7;outline-offset:2px}@media(max-width:910px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){header{grid-template-columns:1fr}.actions{justify-content:flex-start;flex-wrap:wrap!important}.actions #project{width:175px;flex:0 1 175px}}@media(max-width:580px){body{padding:12px}.board{grid-template-columns:1fr}.actions #language{width:100px;flex-basis:100px}.actions #project{width:150px;flex-basis:150px}}
</style></head><body>
<header><div><h1 id="pageTitle">Dynamic Time Board</h1><div id="summary" class="muted help-detail"></div><div id="date" class="muted"></div></div><div class="actions"><select id="language" aria-label="Language"><option value="en">English</option><option value="zh">中文</option></select><select id="project" aria-label="Project"><option value="all">All Projects</option></select><button id="reload" type="button">Refresh Tasks</button><button id="toggleHelp" type="button" aria-pressed="false">Show Help</button></div></header>
<div id="error" role="alert" class="notice error hidden"></div><div id="warning" role="status" class="notice hidden"></div>
<main><section id="board" class="board"></section><section id="alerts" class="alerts"></section><section id="unscheduled" class="bottom"></section><section id="unknown" class="bottom unknown hidden"></section></main>
<div id="status" class="foot help-detail" aria-live="off">Loading tasks…</div><div class="legend help-detail" id="estimateNote"></div>
<script>
/*LOGIC*/
/*APP*/
</script></body></html>
